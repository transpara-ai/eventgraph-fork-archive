    aliases: [opus]
    provider: claude-cli
    auth_mode: subscription
    tier: judgment
    capabilities: [tools, reasoning, coding, vision, operate, large-context, structured-output]
    context_window: 200000
    max_output_tokens: 16384
    # Pricing corrected 2026-07-02 per platform.claude.com/docs/en/about-claude/pricing
    # (was 15.00/75.00/1.50/18.75 — stale). context_window intentionally left
    # at 200000: capability semantics for an in-use model are a separate decision.
    pricing:
      input_per_million: 5.00
      output_per_million: 25.00
      cache_read_per_million: 0.50
      cache_write_per_million: 6.25

  # NOTE: claude-opus-4-6 precedes claude-opus-4-8 on purpose — they tie at
  # output 25.00 and CheapestWithCapabilities keeps the first-in-catalog entry
  # on a tie (strict <), so 4-6 stays the tie winner.
  - id: claude-opus-4-8
